<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturapedia - Animal Crossing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Cabecera -->
        <header class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-emerald-400 mb-2">🌿 Capturapedia ACNH</h1>
            <p class="text-slate-400">Tu guía definitiva para completar el museo de Sócrates.</p>
            <div id="relojSistema" class="text-xs text-emerald-500 font-mono mt-2"></div>
        </header>

        <!-- Navegación por Pestañas -->
        <nav class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="cambiarSeccion('todos')" id="btn-tab-todos" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-emerald-600 text-white shadow-md">🌟 Todo el Museo</button>
            <button onclick="cambiarSeccion('bicho')" id="btn-tab-bicho" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-800 hover:bg-slate-700 text-slate-300">🦋 Bichos</button>
            <button onclick="cambiarSeccion('pez')" id="btn-tab-pez" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-800 hover:bg-slate-700 text-slate-300">🐟 Peces</button>
            <button onclick="cambiarSeccion('marina')" id="btn-tab-marina" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-800 hover:bg-slate-700 text-slate-300">🐙 Criaturas Marinas</button>
            <button onclick="cambiarSeccion('arte')" id="btn-tab-arte" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-800 hover:bg-slate-700 text-slate-300">🖼️ Obras de Arte</button>
            <button onclick="cambiarSeccion('fosil')" id="btn-tab-fosil" class="px-4 py-2 rounded-lg font-semibold text-sm transition bg-slate-800 hover:bg-slate-700 text-slate-300">🦴 Fósiles</button>
        </nav>

        <!-- Tarjeta de Progreso -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg mb-8 max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-2">
                <span id="tituloProgreso" class="text-sm font-bold text-slate-300 uppercase tracking-wider">Progreso Global</span>
                <span id="textoProgreso" class="text-sm font-mono font-bold text-emerald-400">0 / 0 (0%)</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-4 overflow-hidden border border-slate-700">
                <div id="barraProgreso" class="bg-emerald-500 h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <!-- Panel de Filtros -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg mb-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Buscar</label>
                <input type="text" id="buscador" placeholder="Ej. Apolo..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Hemisferio</label>
                <select id="filtroHemisferio" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="norte">Hemisferio Norte</option>
                    <option value="sur">Hemisferio Sur</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Estado</label>
                <select id="filtroEstado" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="todos">Todos</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="capturados">Capturados</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Momento</label>
                <select id="filtroTiempo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="todos">Cualquier momento</option>
                    <option value="ahora">✨ Disponibles Ahora</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Mes Específico</label>
                <select id="filtroMes" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="todos">Todos los meses</option>
                    <option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option><option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option><option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Hora Específica</label>
                <select id="filtroHora" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="todos">Cualquier hora</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Precio</label>
                <select id="ordenPrecio" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="default">Por defecto</option>
                    <option value="asc">Menor a Mayor 📈</option>
                    <option value="desc">Mayor a Menor 📉</option>
                </select>
            </div>
        </div>

        <!-- Contenedor de Especies -->
        <div id="gridEspecies" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- Enlazamos los scripts por separado -->
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
